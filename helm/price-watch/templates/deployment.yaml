# Deployment für die price-watch FastAPI Anwendung.
# Non-Root Security Context, ConfigMap für DATABASE_PATH, PVC für SQLite Persistenz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "price-watch.fullname" . }}
  labels:
    {{- include "price-watch.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "price-watch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "price-watch.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: {{ include "price-watch.fullname" . }}
                  key: DATABASE_PATH
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "price-watch.fullname" . }}