# Service für price-watch, exponiert die Anwendung über NodePort auf den Host.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "price-watch.fullname" . }}
  labels:
    {{- include "price-watch.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "price-watch.selectorLabels" . | nindent 4 }}
