<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Watch</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232d;
    --line: #2a323d;
    --text: #e6edf3;
    --muted: #8b949e;
    --up: #3fb950;
    --down: #f85149;
    --accent: #d2a8ff;
    --rad: 10px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 500px at 80% -10%, #1b2430 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--line);
    padding: 22px 28px;
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .brand span { color: var(--accent); }
  .tagline { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  .search {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--rad);
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    width: 280px;
    max-width: 100%;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .toolbar {
    padding: 18px 28px 0;
    display: flex;
    gap: 12px;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
  }
  .refresh {
    background: var(--accent);
    color: #1a1022;
    border: none;
    border-radius: 8px;
    padding: 9px 16px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  .refresh:hover { filter: brightness(1.08); }
  .refresh:disabled { opacity: 0.5; cursor: default; }
  .grid {
    padding: 18px 28px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }
  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--line);
    border-top: 3px solid var(--rarity, var(--accent));
    border-radius: var(--rad);
    padding: 14px;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--rarity, var(--accent)); }
  .card .imgwrap {
    background:
      radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--rarity) 22%, transparent), transparent 70%),
      #0c1016;
    border-radius: 8px;
    aspect-ratio: 1.6 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card img { width: 88%; object-fit: contain; }
  .card .name { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .card .row { display: flex; align-items: baseline; justify-content: space-between; }
  .card .price { font-size: 18px; font-weight: 700; }
  .card .chg { font-size: 12px; font-weight: 600; }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }
  .chg.flat { color: var(--muted); }
  .empty, .loading {
    padding: 60px 28px;
    color: var(--muted);
    text-align: center;
  }
  /* Detail Overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 12, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 3px solid var(--rarity, var(--accent));
    border-radius: 12px;
    width: 640px;
    max-width: 100%;
    padding: 22px;
  }
  .modal h2 { margin: 0 0 4px; font-size: 18px; }
  .modal .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .modal .close {
    float: right;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
    line-height: 1;
  }
  canvas { max-height: 260px; }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="brand">Price<span>Watch</span></div>
      <div class="tagline">Preisüberwachung für CS2 Marktplatzobjekte</div>
    </div>
    <div class="spacer"></div>
    <input id="search" class="search" type="search" placeholder="Skin suchen...">
  </header>

  <div class="toolbar">
    <button id="refresh" class="refresh">Preise aktualisieren</button>
    <span id="status"></span>
  </div>

  <div id="grid" class="grid"></div>
  <div id="loading" class="loading">Lade Preisdaten...</div>

  <div id="overlay" class="overlay">
    <div class="modal" id="modal">
      <button class="close" id="close">&times;</button>
      <h2 id="m-name"></h2>
      <div class="sub" id="m-sub"></div>
      <canvas id="chart"></canvas>
    </div>
  </div>

<script>
const RARITY = {
  // name_color aus der Steam Market API, pro Skin
  "AK-47 | Redline (Field-Tested)": "#d32ce6",
  "AWP | Asiimov (Field-Tested)": "#eb4b4b",
  "Desert Eagle | Blaze (Factory New)": "#8847ff",
  "USP-S | Kill Confirmed (Field-Tested)": "#eb4b4b",
};

let allPrices = [];
let chart = null;

function fmt(n) { return Number(n).toFixed(2); }

async function loadPrices() {
  const res = await fetch("/api/prices");
  const data = await res.json();
  allPrices = data.prices;
  document.getElementById("loading").style.display = allPrices.length ? "none" : "block";
  document.getElementById("loading").textContent = allPrices.length
    ? "" : "Noch keine Preise. Klicke auf 'Preise aktualisieren'.";
  render();
}

async function changeFor(item) {
  // Holt die letzten zwei Punkte fuer die prozentuale Aenderung
  const res = await fetch("/api/prices/history?item=" + encodeURIComponent(item));
  const data = await res.json();
  const h = data.history;
  if (h.length < 2) return null;
  const prev = h[h.length - 2].price, cur = h[h.length - 1].price;
  return ((cur - prev) / prev) * 100;
}

async function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  const list = allPrices.filter(p => p.item_name.toLowerCase().includes(q));
  if (!list.length) {
    grid.innerHTML = '<div class="empty">Keine Skins gefunden.</div>';
    return;
  }
  for (const p of list) {
    const rarity = RARITY[p.item_name] || "#d2a8ff";
    const chg = await changeFor(p.item_name);
    let chgHtml = '<span class="chg flat">&middot;</span>';
    if (chg !== null) {
      const cls = chg > 0.01 ? "up" : chg < -0.01 ? "down" : "flat";
      const sign = chg > 0 ? "+" : "";
      chgHtml = `<span class="chg ${cls}">${sign}${chg.toFixed(2)}%</span>`;
    }
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--rarity", rarity);
    card.innerHTML = `
      <div class="imgwrap"><img src="${p.image_url}" alt="${p.item_name}" loading="lazy"></div>
      <div class="name">${p.item_name}</div>
      <div class="row">
        <span class="price">${fmt(p.price)} ${p.currency}</span>
        ${chgHtml}
      </div>`;
    card.addEventListener("click", () => openDetail(p, rarity));
    grid.appendChild(card);
  }
}

async function openDetail(p, rarity) {
  const res = await fetch("/api/prices/history?item=" + encodeURIComponent(p.item_name));
  const data = await res.json();
  const h = data.history;
  document.getElementById("m-name").textContent = p.item_name;
  document.getElementById("m-sub").textContent =
    `${h.length} Datenpunkte · aktuell ${fmt(p.price)} ${p.currency}`;
  document.getElementById("modal").style.setProperty("--rarity", rarity);
  document.getElementById("overlay").classList.add("open");

  const labels = h.map(e => new Date(e.timestamp).toLocaleString("de-CH",
    {hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit"}));
  const values = h.map(e => e.price);
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels, datasets: [{
      data: values, borderColor: rarity, backgroundColor: rarity + "22",
      fill: true, tension: 0.3, pointRadius: 2,
    }]},
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: "#8b949e", maxTicksLimit: 8 }, grid: { color: "#2a323d" } },
        y: { ticks: { color: "#8b949e" }, grid: { color: "#2a323d" } },
      },
    },
  });
}

document.getElementById("close").addEventListener("click",
  () => document.getElementById("overlay").classList.remove("open"));
document.getElementById("overlay").addEventListener("click", e => {
  if (e.target.id === "overlay") e.target.classList.remove("open");
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("refresh").addEventListener("click", async (e) => {
  const btn = e.target;
  btn.disabled = true;
  document.getElementById("status").textContent = "Rufe Preise ab...";
  await fetch("/api/prices/refresh", { method: "POST" });
  await loadPrices();
  document.getElementById("status").textContent = "Aktualisiert.";
  btn.disabled = false;
  setTimeout(() => document.getElementById("status").textContent = "", 2000);
});

loadPrices();
</script>
</body>
</html>
