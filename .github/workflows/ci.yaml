name: CI - Build und Push

on:
  push:
    branches:
      - main
    paths:
      - 'app/backend/**'
      - 'helm/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/backend/**'
      - 'helm/**'

jobs:
  lint-and-test:
    name: Lint und Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: ruff
        run: ruff check .

      - name: pytest
        run: pytest

      - name: Helm einrichten
        uses: azure/setup-helm@v4

      - name: helm lint
        working-directory: .
        run: helm lint helm/price-watch

      - name: helm template
        working-directory: .
        run: helm template price-watch helm/price-watch > /dev/null

  build-and-push:
    name: Container Image bauen und pushen
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'

    permissions:
      contents: write
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Metadaten extrahieren
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cancani/price-watch-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Helm values.yaml mit neuem Image aktualisieren
        run: |
          SHORT_SHA="sha-$(echo '${{ github.sha }}' | cut -c1-7)"

          sed -i "s|^  repository:.*|  repository: ghcr.io/cancani/price-watch-backend|" helm/price-watch/values.yaml
          sed -i "s|^  tag:.*|  tag: ${SHORT_SHA}|" helm/price-watch/values.yaml
          sed -i "s|^  pullPolicy:.*|  pullPolicy: Always|" helm/price-watch/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/price-watch/values.yaml

          if git diff --staged --quiet; then
            echo "Keine Änderungen in values.yaml, kein Commit nötig."
          else
            git commit -m "chore: image tag auf ${SHORT_SHA} gesetzt [skip ci]"
            git push
          fi