name: CI - Build und Push

# Trigger: nur auf main
on:
  push:
    branches:
      - main
    paths:
      - 'app/backend/**'

jobs:
  build-and-push:
    name: Container Image bauen und pushen
    runs-on: ubuntu-latest

    permissions:
      contents: write   # für den values.yaml Commit zurück auf main
      packages: write   # für den Push nach GHCR

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image Metadaten extrahieren
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/price-watch-backend
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: app/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Helm values.yaml mit neuem Image aktualisieren
        run: |
          SHORT_SHA="sha-$(echo '${{ github.sha }}' | cut -c1-7)"

          sed -i "s|^  repository:.*|  repository: ghcr.io/${{ github.repository_owner }}/price-watch-backend|" helm/price-watch/values.yaml
          sed -i "s|^  tag:.*|  tag: ${SHORT_SHA}|" helm/price-watch/values.yaml
          sed -i "s|^  pullPolicy:.*|  pullPolicy: Always|" helm/price-watch/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/price-watch/values.yaml

          if git diff --staged --quiet; then
            echo "Keine Änderungen in values.yaml, kein Commit nötig."
          else
            git commit -m "chore: image tag auf ${SHORT_SHA} gesetzt [skip ci]"
            git push
          fi